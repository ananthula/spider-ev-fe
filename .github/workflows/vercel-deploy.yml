name: Rebuild site from WordPress

# Calls the Vercel deploy hook so the live site rebuilds with the latest posts.
# The hook URL is hardcoded below. This repo is public, so anyone who finds the
# URL can trigger a rebuild. Fine for testing; regenerate it before launch.

on:
  schedule:
    # Once a day at 00:30 UTC = 6:00 AM IST. GitHub can delay scheduled runs by a few minutes.
    - cron: "30 0 * * *"
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions: {}

jobs:
  call-deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel deploy hook
        run: curl -fsSL -X POST "https://api.vercel.com/v1/integrations/deploy/prj_5YI3ZTnprlZ9HsLtRrfHbeA4TFHW/PTvpZQan3u"
